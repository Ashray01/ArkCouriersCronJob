name: Trigger Supabase Email Function

on:
  schedule:
    - cron: "*/5 * * * *"  # Runs every 5 minutes (UTC)
  workflow_dispatch:         # Allows manual runs from GitHub Actions UI

jobs:
  trigger-function:
    runs-on: ubuntu-latest

    steps:
      - name: Call Supabase Edge Function
        env:
          SUPABASE_FUNCTION_URL: https://asnkirvhzzpxpcmualwn.functions.supabase.co/send-package-email
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          echo "Triggering Supabase function at $SUPABASE_FUNCTION_URL"
          curl -X GET "$SUPABASE_FUNCTION_URL" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY"
